# fly deploy -c fly.demo.toml   (change app to a unique name first)
app = "brightboard-demo-CHANGEME"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.demo"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
