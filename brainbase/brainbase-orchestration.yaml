# Launchproof team on Brainbase.
# From this directory (brainbase/): claim each agent, then:
#   brainbase orchestration create   # first time
#   brainbase orchestration push
# Member folders must be ./agents/<slug>/ next to this file (Brainbase CLI convention).
# If the CLI rejects edge/trigger syntax, draw the same graph in the orchestration canvas.
schema: 1
orchestration:
  name: Launchproof Team
  description: Tester runs checks; Chaos probes messy humans; Critic scores visual appeal; Triage files; Janitor reaps Fly
  credit_limit: 400
members:
  - slug: tester
    name: Launchproof Tester
  - slug: chaos
    name: Launchproof Chaos
  - slug: critic
    name: Launchproof Critic
  - slug: triage
    name: Launchproof Triage
  - slug: janitor
    name: Launchproof Janitor
edges:
  - from: tester
    to: chaos
    description: Heuristic UI done. Probe messy-human scenarios within budget.
    payload_schema:
      type: object
      required: [url, run_id, budget]
      properties:
        url: {type: string}
        run_id: {type: string}
        budget:
          type: object
          properties:
            max_chaos_scenarios: {type: integer}
            max_vision_views: {type: integer}
            max_pages_hint: {type: integer}
            credit_soft_cap: {type: integer}
        pages:
          type: array
          items: {type: string}
    settings:
      max_handoffs: 1
  - from: tester
    to: critic
    description: Score visual appeal within vision budget (pages from Tester; Chaos states may arrive separately).
    payload_schema:
      type: object
      required: [url, run_id, budget]
      properties:
        url: {type: string}
        run_id: {type: string}
        budget:
          type: object
          properties:
            max_chaos_scenarios: {type: integer}
            max_vision_views: {type: integer}
            max_pages_hint: {type: integer}
            credit_soft_cap: {type: integer}
        pages:
          type: array
          items: {type: string}
        interesting_states:
          type: array
          items:
            type: object
            properties:
              url: {type: string}
              viewport: {type: string}
              why: {type: string}
              evidence: {type: string}
    settings:
      max_handoffs: 1
  - from: chaos
    to: critic
    description: Interesting states after messy probes. Spend remaining vision budget here first.
    payload_schema:
      type: object
      required: [url, run_id, budget, interesting_states]
      properties:
        url: {type: string}
        run_id: {type: string}
        budget:
          type: object
          properties:
            max_vision_views: {type: integer}
            credit_soft_cap: {type: integer}
        interesting_states:
          type: array
          items:
            type: object
            properties:
              url: {type: string}
              viewport: {type: string}
              why: {type: string}
              evidence: {type: string}
        chaos_issues:
          type: array
          items: {type: object}
    settings:
      max_handoffs: 1
  - from: chaos
    to: tester
    description: Chaos findings ready to merge into the report.
    payload_schema:
      type: object
      required: [run_id, chaos_issues]
      properties:
        run_id: {type: string}
        scenarios_run: {type: array, items: {type: string}}
        chaos_issues: {type: array, items: {type: object}}
        interesting_states: {type: array, items: {type: object}}
        spent: {type: object}
    settings:
      max_handoffs: 1
  - from: critic
    to: tester
    description: Appeal score and visual issues ready to merge.
    payload_schema:
      type: object
      required: [run_id, visual_issues]
      properties:
        run_id: {type: string}
        appeal_score: {type: integer}
        views_used: {type: integer}
        visual_issues: {type: array, items: {type: object}}
        notes: {type: string}
        spent: {type: object}
    settings:
      max_handoffs: 1
  - from: tester
    to: triage
    description: Report ready. File it in Slack and Linear.
    payload_schema:
      type: object
      required: [url, run_id, score, headline, issues]
      properties:
        url: {type: string}
        run_id: {type: string}
        score: {type: integer}
        grade: {type: string}
        report_link: {type: string}
        headline: {type: array, items: {type: string}}
        issues:
          type: array
          items:
            type: object
            required: [severity, kind, detail]
            properties:
              severity: {type: string, enum: [critical, high, medium, low]}
              kind: {type: string}
              where: {type: string}
              detail: {type: string}
              fix_prompt: {type: string}
    settings:
      max_handoffs: 1
triggers:
  # Disabled while Fly billing is blocked. Set is_active: true after FLY_API_TOKEN + FLY_APP are set.
  - type: schedule
    node_id: 7c3a1e20-9b4d-4f1a-8e2c-a1b2c3d4e5f6
    is_active: false
    config:
      cron_expression: "*/30 * * * *"   # UTC
    to:
      - agent: janitor
        description: Reap any Launchproof load machine older than 10 minutes
