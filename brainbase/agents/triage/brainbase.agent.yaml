    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - id: 6b0a4149-36ed-4feb-86d4-244730a2f7a5
    slug: slack-summary-present
    criteria: Pass when a Slack message (or notify send) includes the score, grade,
      and at least one critical or high issue with evidence.
