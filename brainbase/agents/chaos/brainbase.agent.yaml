schema: 1
harness: claude-code
machine_kind: daytona
default_model: claude-sonnet-5
agent:
  name: Launchproof Chaos
  tagline: Messy-human probes — rage clicks, double submits, navigate while loading
instructions:
  file: ./instructions.md
entrypoint:
  file: ./entrypoint.sh
capabilities:
  memory: false
  browser: true
mcp:
  - name: launchproof
    command: python3
    args: ["-m", "launchproof.mcp_server"]
    env:
      PYTHONPATH: /workspace/launchproof
    is_enabled: true
evals:
  - slug: respects-budget
    criteria: Pass only if the agent ran at most max_chaos_scenarios from the handoff budget and stopped when the cap was hit.
  - slug: same-site-only
    criteria: Pass only if every URL opened was the site under test (or a same-site path). No payment forms filled with real cards; no load tests.
  - slug: structured-handoff
    criteria: Pass when the final reply includes a JSON object with scenarios_run, chaos_issues, and interesting_states.
