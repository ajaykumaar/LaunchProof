# brainbase.agent.yaml — declarative agent manifest.
# Committed to source control. Edit by hand, then `brainbase agent push`.

schema: 1
id: 7b65ccda-d248-4947-8ccf-5fc68da34f03
harness: claude-code
machine_kind: daytona
default_model: claude-sonnet-5
agent:
  name: Launchproof Chaos
  tagline: Messy-human probes — rage clicks, double submits, navigate while loading
instructions:
  file: ./instructions.md
entrypoint:
  file: ./entrypoint.sh
playbooks: []
skills: []
mcp:
  - name: launchproof
    command: python3
    args:
      - -m
      - launchproof.mcp_server
    env:
      PYTHONPATH: /workspace/launchproof
    is_enabled: true
evals:
  - id: 07388057-ac0f-4f93-b679-9e9ad6549593
    slug: respects-budget
    criteria: Pass only if the agent ran at most max_chaos_scenarios from the
      handoff budget and stopped when the cap was hit.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - id: 458bd653-9d28-4aef-88df-51239e7b9b8b
    slug: same-site-only
    criteria: Pass only if every URL opened was the site under test (or a same-site
      path). No payment forms filled with real cards; no load tests.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - id: a43aacc7-9b25-4d9b-838c-a11ca43f5e99
    slug: structured-handoff
    criteria: Pass when the final reply includes a JSON object with scenarios_run,
      chaos_issues, and interesting_states.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
capabilities:
  memory: false
  browser: true
