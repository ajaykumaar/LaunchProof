# fly deploy -c fly.api.toml --ha=false   (change app to a unique name first)
app = "launchproof-api-CHANGEME"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
